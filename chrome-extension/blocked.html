<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stay focused — Mr. Tapioca</title>
<style>
  :root{--bark:#3c2018;--cream:#fdf5ec;--bark-mid:#8b5e4a;--gold:#f0bb4f;}
  *{box-sizing:border-box;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(900px 500px at 50% -10%,#fff6e6,#fdf5ec 60%);color:var(--bark);text-align:center;padding:24px;}
  .box{max-width:440px;}
  img{width:180px;height:180px;filter:drop-shadow(0 18px 24px rgba(60,32,24,.24));animation:bob 4.5s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  h1{font-size:2rem;font-weight:900;margin:14px 0 8px;}
  p{font-size:1.05rem;color:#5a3d2f;line-height:1.55;}
  .site{font-weight:800;color:var(--bark);}
  .timer{font-size:3rem;font-weight:900;margin:18px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .sub{font-size:.85rem;color:var(--bark-mid);font-weight:600;}
  .done{margin-top:18px;font-size:1.1rem;font-weight:800;color:var(--gold);display:none;}
</style>
</head>
<body>
  <div class="box">
    <img src="icons/mascot.png" alt="Mr. Tapioca">
    <h1>Stay focused 🧋</h1>
    <p>Mr. Tapioca is still mixing your drink. <span class="site" id="site"></span> is locked until your focus session ends.</p>
    <div class="timer" id="timer">--:--</div>
    <div class="sub">left in this session</div>
    <div class="done" id="done">Your drink is ready 🧋 This site is unlocked now. Open it again from your history or bookmarks.</div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
