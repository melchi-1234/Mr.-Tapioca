<!doctype html>
<html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  *{margin:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif;}
  html,body{width:1280px;height:800px;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;text-align:center;color:#3c2018;
    background:radial-gradient(900px 560px at 50% -6%,#fff6e6,#fdf5ec 62%);}
  .box{max-width:760px;}
  img{width:230px;height:230px;filter:drop-shadow(0 20px 26px rgba(60,32,24,.26));}
  h1{font-size:3.4rem;font-weight:900;letter-spacing:-.02em;margin:18px 0 12px;}
  p{font-size:1.5rem;color:#5a3d2f;line-height:1.5;}
  .site{font-weight:800;color:#3c2018;}
  .timer{font-size:4.6rem;font-weight:900;margin:26px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .sub{font-size:1.15rem;color:#8b5e4a;font-weight:600;}
</style></head>
<body><div class="box">
  <img src="mascot.png" alt="">
  <h1>Stay focused 🧋</h1>
  <p>Mr. Tapioca is still mixing your drink.<br><span class="site">instagram.com</span> is locked until your session ends.</p>
  <div class="timer">18:42</div>
  <div class="sub">left in this session</div>
</div></body></html>
