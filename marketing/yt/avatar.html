<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  body {
    width: 800px; height: 800px; overflow: hidden; position: relative;
    background: radial-gradient(circle at 38% 30%, #fff8ee 0%, #fbeeda 52%, #f5dcc0 100%);
  }
  /* whisper of rose warmth pooling at the bottom, like the app backdrop */
  .glow {
    position: absolute; left: -10%; right: -10%; bottom: -22%; height: 55%;
    background: radial-gradient(ellipse at 50% 100%, rgba(239,111,141,0.16) 0%, transparent 68%);
  }
  .char {
    position: absolute; left: 50%; top: 53%; transform: translate(-50%, -50%);
    width: 568px; height: 568px;
    filter: drop-shadow(0 18px 26px rgba(60,32,24,0.22));
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <img class="char" src="../../assets/Mr.%20Tapioca.png">
</body>
</html>
